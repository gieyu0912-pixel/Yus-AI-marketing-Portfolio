*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#07101b 0%,#0b1522 100%);color:var(--text);

.wrap{width:min(1180px,100%);margin:auto;padding:28px 20px 64px}
.brand{font-weight:900;letter-spacing:7px;color:var(--gold);font-size:20px}

.toolbar{display:grid;grid-template-columns:1.1fr 1.1fr 2fr auto;gap:12px;margin:26px 0 18px}
select,input, .reset{min-height:54px;border-radius:14px;border:1px solid var(--line);background:#101c2a;color:var(--text);padding:0 16px;outline:none}
select:focus,input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d9ad6020}
.reset{border-color:var(--gold);padding:0 20px}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0;color:var(--muted)}
.pageBtns{display:flex;gap:8px}
.pageBtns button{border:1px solid var(--line);background:#101c2a;color:var(--text);border-radius:10px;padding:8px 12px}
.pageBtns button:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:1fr;gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 16px 40px #0005}
.visual{background:#08111d;padding:18px;display:flex;justify-content:center;align-items:center}
.visual img{display:block;width:80%;aspect-ratio:16/9;height:auto;object-fit:contain;border-radius:12px;background:#0a111a;box-shadow:0 10px 35px #0008}
.body{padding:22px 24px 26px}
.kicker{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cat{color:var(--teal);font-weight:800;font-size:18px}
.num{color:var(--gold);font-weight:900;font-size:22px}
.name{font-size:clamp(26px,4vw,38px);font-weight:900;margin:7px 0 16px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tag{background:#efe2c6;color:#18212b;border-radius:9px;padding:6px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
.meta{display:grid;grid-template-columns:90px 1fr;gap:9px 14px;color:#dce3ea;line-height:1.6}
.meta .label{color:var(--muted)}
.prompt{margin-top:18px;padding:16px;border-radius:14px;background:#08111d;border:1px solid #1f3044;color:#dce3ea;line-height:1.7;white-space:pre-wrap}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.copy{border:1px solid var(--gold);background:#162332;color:var(--text);border-radius:12px;padding:11px 16px}
.copy.ok{background:#23443f}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
footer{margin-top:36px;color:#748297;font-size:13px;text-align:center}
@media(max-width:860px){.toolbar{grid-template-columns:1fr 1fr}.reset{grid-column:1/-1}}
@media(max-width:600px){
 .wrap{padding:22px 14px 50px} .toolbar{grid-template-columns:1fr}

 .visual{padding:12px} .visual img{width:80%}
 .body{padding:18px} .meta{grid-template-columns:72px 1fr}
 h1{font-size:38px}
}
</style>
</head>

const PAGE_SIZE = 5;
let page = 1;

const $ = (id) => document.getElementById(id);
const category = $("category");
const scenario = $("scenario");
const search = $("search");
const grid = $("grid");
const statusText = $("statusText");
const prev = $("prev");
const next = $("next");

const categories = [...new Set(DATA.map(x => x.cat))];
for (const c of categories) {
  const o = document.createElement("option");
  o.value = c; o.textContent = c; category.appendChild(o);
}
for (const x of DATA) {
  const o = document.createElement("option");
  o.value = String(x.n);
  o.textContent = String(x.n).padStart(2,"0") + "｜" + x.cat + "｜" + x.name;
  scenario.appendChild(o);
}

function makePrompt(x) {
  return `Create a premium cinematic commercial for ${x.product}. ${x.scene} Maintain accurate product appearance, realistic materials, controlled cinematic lighting, shallow depth of field, polished commercial cinematography. Recommended format: 16:9.`;
}

function filtered() {
  const c = category.value;
  const s = scenario.value;
  const q = search.value.trim().toLowerCase();
  return DATA.filter(x =>
    (c === "all" || x.cat === c) &&
    (s === "all" || String(x.n) === s) &&
    (!q || `${x.n} ${x.cat} ${x.name} ${x.tags} ${x.product} ${x.scene}`.toLowerCase().includes(q))
  );
}

function render() {
  const arr = filtered();
  const totalPages = Math.max(1, Math.ceil(arr.length / PAGE_SIZE));
  page = Math.min(page, totalPages);
  const start = (page - 1) * PAGE_SIZE;
  const pageItems = arr.slice(start, start + PAGE_SIZE);

  statusText.textContent = `顯示 ${arr.length} / 100 情境｜第 ${page} / ${totalPages} 頁`;
  prev.disabled = page <= 1;
  next.disabled = page >= totalPages;

  if (!pageItems.length) {
    grid.innerHTML = '<div class="empty">找不到符合條件的情境。</div>';
    return;
  }

  grid.innerHTML = pageItems.map(x => `
    <article class="card">
      <div class="visual">
        <img src="${x.image}" alt="${x.cat}｜${x.name}" loading="lazy"
             width="1600" height="900"
             onerror="this.closest('.visual').dataset.error='1'; this.alt='圖片載入失敗：'+x.name;">
      </div>
      <div class="body">
        <div class="kicker"><div class="cat">${escapeHtml(x.cat)}</div><div class="num">${String(x.n).padStart(2,"0")} / 100</div></div>
        <div class="name">${escapeHtml(x.name)}</div>
        <div class="tags">${x.tags.split(" ").map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>
        <div class="meta">
          <div class="label">商品</div><div>${escapeHtml(x.product)}</div>
          <div class="label">場景</div><div>${escapeHtml(x.scene)}</div>
          <div class="label">比例</div><div>16:9 橫式</div>
          <div class="label">圖片</div><div>poster_${String(x.n).padStart(3,"0")}.webp</div>
        </div>
        <div class="prompt" id="prompt-${x.n}">${escapeHtml(makePrompt(x))}</div>
        <div class="actions"><button class="copy" data-copy="${x.n}">複製完整 Prompt</button></div>
      </div>
    </article>
  `).join("");

  grid.querySelectorAll("[data-copy]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const x = DATA[Number(btn.dataset.copy) - 1];
      try {
        await navigator.clipboard.writeText(makePrompt(x));
        btn.textContent = "✓ 已複製";
        btn.classList.add("ok");
        setTimeout(() => { btn.textContent = "複製完整 Prompt"; btn.classList.remove("ok"); }, 1200);
      } catch {
        window.prompt("請複製以下 Prompt：", makePrompt(x));
      }
    });
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));
}

category.addEventListener("change", () => { page=1; render(); });
scenario.addEventListener("change", () => { page=1; render(); });
search.addEventListener("input", () => { page=1; render(); });
prev.addEventListener("click", () => { if(page>1){page--;render();window.scrollTo({top:0,behavior:"smooth"});} });
next.addEventListener("click", () => { page++;render();window.scrollTo({top:0,behavior:"smooth"}); });
$("reset").addEventListener("click", () => {
  category.value="all"; scenario.value="all"; search.value=""; page=1; render();
});
render();
</script>
