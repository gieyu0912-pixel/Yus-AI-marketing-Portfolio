services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 8080
      DATA_DIR: /data
      UPLOAD_DIR: /data/uploads
      DATABASE_URL: sqlite:////data/nailpick.db
    volumes:
      - nailpick-data:/data

volumes:
  nailpick-data:
